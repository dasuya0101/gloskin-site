<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Get GloSkin</title>
  <meta name="description" content="Download GloSkin — your AI skincare guru. Scan your face, get your Glo Score." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Smart App Banner: Safari on iOS shows a native install strip even if the redirect is swallowed. -->
  <meta name="apple-itunes-app" content="app-id=6763679982" />

  <!-- Link preview (TikTok / iMessage / DMs read these; crawlers don't run the redirect). -->
  <meta property="og:title" content="Get GloSkin" />
  <meta property="og:description" content="Scan your face in 60 seconds. Get your Glo Score. Meet your AI skincare guru." />
  <meta property="og:url" content="https://gloskin.app/get" />
  <meta property="og:image" content="https://gloskin.app/assets/img/glo-face.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <noscript><meta http-equiv="refresh" content="0;url=https://apps.apple.com/app/id6763679982?ct=tiktok_bio" /></noscript>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <script>
  (function () {
    // GloSkin's App Store ID (App Store Connect → App Information → Apple ID).
    // If this ever changes, update it in all 4 places: here, the smart-app-banner
    // meta, the <noscript> refresh, and the fallback button's href.
    var APP_ID = "6763679982";

    var HOME = "https://gloskin.app/";

    // Campaign token → App Analytics → Acquisition → Campaign.
    // /get           → tiktok_bio   (the link in the TikTok bio)
    // /get?c=ig_bio  → ig_bio       (any other surface, no new page needed)
    // Whitelist-sanitized, so this can't be used to redirect anywhere but the App Store.
    function campaign() {
      var m = /[?&]c=([A-Za-z0-9_]{1,40})(?:&|$)/.exec(location.search);
      return m ? m[1] : "tiktok_bio";
    }

    function isIOS() {
      var ua = navigator.userAgent || "";
      if (/iPhone|iPad|iPod/i.test(ua)) return true;
      // iPadOS 13+ masquerades as macOS; touch points give it away.
      return /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
    }

    var ready = /^[0-9]+$/.test(APP_ID);
    var target = ready
      ? "https://apps.apple.com/app/id" + APP_ID + "?ct=" + campaign()
      : null;

    // Android + desktop land on the marketing site (waitlist) instead of a
    // dead App Store page.
    if (!isIOS()) {
      location.replace(HOME);
      return;
    }

    if (target) {
      // replace(), not href = — keeps /get out of history so Back returns to TikTok.
      location.replace(target);
    }

    // The visible button below is the safety net: TikTok's in-app browser
    // occasionally eats instant redirects, and a blank white screen kills the tap.
    document.addEventListener("DOMContentLoaded", function () {
      var btn = document.getElementById("cta");
      if (target) btn.href = target;
      else document.getElementById("card").classList.add("unconfigured");
    });
  })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple-600: #7C3AED; --purple-500: #8B5CF6; --purple-100: #EDE9FE;
      --purple-50: #F5F3FF; --white: #FFFFFF; --gray-500: #6B7280; --gray-900: #111827;
    }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, var(--purple-50) 0%, var(--white) 50%, var(--purple-100) 100%);
      color: var(--gray-900); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: var(--white); border-radius: 28px; padding: 44px 32px;
      max-width: 420px; width: 100%; text-align: center;
      box-shadow: 0 20px 60px rgba(124,58,237,0.1), 0 4px 16px rgba(0,0,0,0.04);
    }
    .logo { font-size: 1.2rem; font-weight: 900; color: var(--purple-600); margin-bottom: 24px; }
    .glo { width: 96px; height: 96px; object-fit: contain; margin: 0 auto 20px; display: block; }
    h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 10px; }
    .subtitle { font-size: 1rem; color: var(--gray-500); margin-bottom: 28px; line-height: 1.6; }
    .badge {
      display: inline-flex; align-items: center; gap: 10px; text-decoration: none;
      background: var(--gray-900); color: var(--white);
      padding: 13px 22px; border-radius: 14px; transition: transform .15s ease, opacity .15s ease;
    }
    .badge:active { transform: scale(.97); opacity: .9; }
    .badge svg { width: 26px; height: 26px; flex: none; }
    .badge .stack { display: grid; text-align: left; line-height: 1.15; }
    .badge .small { font-size: .68rem; font-weight: 600; opacity: .85; }
    .badge .big { font-size: 1.12rem; font-weight: 800; letter-spacing: -.01em; }
    .alt { margin-top: 22px; font-size: .85rem; color: var(--gray-500); }
    .alt a { color: var(--purple-600); font-weight: 700; text-decoration: none; }
    .card.unconfigured .badge { pointer-events: none; opacity: .35; }
    .card.unconfigured .subtitle::after {
      content: "Setup pending: App Store ID not yet configured.";
      display: block; margin-top: 10px; font-size: .8rem; font-weight: 700; color: #B45309;
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo">GloSkin</div>
    <img class="glo" src="/assets/img/glo-wave-cutout.png" alt="" />
    <h1>Opening the App Store…</h1>
    <p class="subtitle">If nothing happens, tap the button below.</p>

    <a class="badge" id="cta" href="https://apps.apple.com/app/id6763679982?ct=tiktok_bio">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16.365 1.43c0 1.14-.43 2.23-1.18 3.04-.79.84-2.07 1.5-3.13 1.42-.13-1.13.42-2.31 1.16-3.07.84-.86 2.27-1.51 3.15-1.39ZM20.5 17.34c-.55 1.27-.81 1.84-1.52 2.97-.99 1.57-2.39 3.53-4.12 3.55-1.54.02-1.93-1-4.02-.99-2.09.01-2.52 1.01-4.06.99C5.03 23.84 3.7 22.07 2.7 20.5 1.04 17.86.32 14.78 1.36 12.21c.74-1.83 2.43-3 4.21-3.03 1.51-.03 2.94 1.02 3.86 1.02.92 0 2.66-1.26 4.49-1.07.77.03 2.92.31 4.31 2.34-3.78 2.07-3.16 7.49 2.27 5.87Z"/></svg>
      <span class="stack">
        <span class="small">Download on the</span>
        <span class="big">App Store</span>
      </span>
    </a>

    <p class="alt">Not on iPhone? <a href="/">Visit gloskin.app</a></p>
  </div>
</body>
</html>
