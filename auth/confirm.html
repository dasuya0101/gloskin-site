<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Confirmed — GloSkin</title>
  <meta name="description" content="Your GloSkin email has been verified. You can now sign in to the app." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple-600: #7C3AED; --purple-500: #8B5CF6; --purple-400: #A78BFA;
      --purple-100: #EDE9FE; --purple-50: #F5F3FF; --white: #FFFFFF;
      --gray-500: #6B7280; --gray-900: #111827;
    }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(135deg, var(--purple-50) 0%, var(--white) 50%, var(--purple-100) 100%);
      color: var(--gray-900); min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      background: var(--white); border-radius: 28px; padding: 48px 36px;
      max-width: 440px; width: 100%; text-align: center;
      box-shadow: 0 20px 60px rgba(124,58,237,0.1), 0 4px 16px rgba(0,0,0,0.04);
    }
    .checkmark {
      width: 72px; height: 72px; border-radius: 50%;
      background: linear-gradient(135deg, var(--purple-500), var(--purple-600));
      display: flex; align-items: center; justify-content: center; margin: 0 auto 24px;
    }
    .checkmark svg { width: 36px; height: 36px; stroke: white; stroke-width: 3; fill: none; }
    h1 { font-size: 1.75rem; font-weight: 800; margin-bottom: 12px; color: var(--gray-900); }
    .subtitle { font-size: 1.05rem; color: var(--gray-500); margin-bottom: 32px; line-height: 1.6; }
    .logo { font-size: 1.2rem; font-weight: 900; color: var(--purple-600); margin-bottom: 32px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">GloSkin</div>
    <div class="checkmark">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <polyline points="20 6 9 17 4 12" />
      </svg>
    </div>
    <h1>Email Confirmed!</h1>
    <p class="subtitle">
      Your account has been verified. You can close this page and reopen GloSkin to sign in.
    </p>
  </div>
</body>
</html>
